  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    padding: 0;
  }
  h1 {
    text-align: center;
    color: #6a0dad;
    margin-top: 40px;
  }
  table {
    width: 80%;
    margin: 40px auto;
    border-collapse: collapse;
    background-color: #fff;
    box-shadow: 0 0 15px rgba(106, 13, 173, 0.2);
    border-radius: 10px;
    overflow: hidden;
  }
  th {
    background-color: #c084fc;
    color: white;
    font-size: 1.2em;
    padding: 15px;
  }
  td {
    text-align: center;
    padding: 15px;
    border-bottom: 1px solid #e2d6f3;
  }
  a {
    color: #6a0dad;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s;
  }
  a:hover {
    color: #b266ff;
    text-decoration: underline;
  }
  tr:hover {
    background-color: #f3e8ff;
  }
 /* --- VIDEO RESPONSIVO --- */

      width: 100%;

      margin: auto;

    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
</style>
