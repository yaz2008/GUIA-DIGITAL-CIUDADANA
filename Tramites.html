    <style>

        /* 🔷 ESTILO DE HEXÁGONOS AÑADIDO */
        .hex{
            width: 160px;
            height: 140px;
            clip-path: polygon(
                50% 0%,
                93% 25%,
                93% 75%,
                50% 100%,
                7% 75%,
                7% 25%
            );
            overflow: hidden;
            margin: auto;
        }

        .hex img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* TUS ESTILOS IGUALITOS, NO LOS MOVÍ */

        .fondo-valle{
            background-image: linear-gradient(to top, #0593bb 20%, #0e26ae 80%);
            background-size: cover;
            background-position: center center;
            width: 100%;
            height: 80vh;
            background-attachment: fixed;
        }
        .contenido-fondo-valle{
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        @keyframes move_wave {
            0% { transform: translateX(0) translateZ(0) scaleY(1) }
            50% { transform: translateX(-25%) translateZ(0) scaleY(0.55) }
            100% { transform: translateX(-50%) translateZ(0) scaleY(1) }
        }
        .waveWrapper {
            overflow: hidden;
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            top: 0;
            margin: auto;
        }
        .waveWrapperInner {
            position: absolute;
            width: 100%;
            overflow: hidden;
            height: 70%;
        }
        .bgTop { z-index: 15; opacity: 0.5; }
        .bgMiddle { z-index: 10; opacity: 0.75; }
        .bgBottom { z-index: 5; }

        .wave {
            position: absolute;
            left: 0;
            width: 200%;
            height: 100%;
            background-repeat: repeat no-repeat;
            background-position: 0 bottom;
            transform-origin: center bottom;
        }
        .waveTop { background-size: 50% 100px; }
        .waveAnimation .waveTop {
            animation: move-wave 3s;
            -webkit-animation: move-wave 3s;
            -webkit-animation-delay: 1s;
            animation-delay: 1s;
        }
        .waveMiddle { background-size: 50% 120px; }
        .waveAnimation .waveMiddle { animation: move_wave 10s linear infinite; }

        .waveBottom { background-size: 50% 100px; }
        .waveAnimation .waveBottom { animation: move_wave 15s linear infinite; }

    </style>
