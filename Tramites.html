<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tramites</title>
    <link rel="stylesheet" href="principal.css">
    <link rel="icon" href="img/unnamed-removebg-preview.png" type="png">

    <style>

        /* --- FONDO ORIGINAL --- */
        .fondo-valle{
            background-image: linear-gradient(to top, #0593bb 20%, #0e26ae 80%);
            background-size: cover;
            background-position: center center;
            width: 100%;
            height: 80vh;
            background-attachment: fixed;
        }

        .contenido-fondo-valle{
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes move_wave {
            0% { transform: translateX(0) scaleY(1) }
            50% { transform: translateX(-25%) scaleY(0.55) }
            100% { transform: translateX(-50%) scaleY(1) }
        }

        /* ------------------------------------------------- */
        /*            FONDO DETRÁS DEL PANAL                */
        /* ------------------------------------------------- */
        .fondo-panal{
            width: 100%;
            padding: 60px 0;
            background: linear-gradient(135deg, #d1e9ff 0%, #b6d7ff 50%, #d1e9ff 100%);
            background-size: cover;
        }

        /* ------------------------------------------------- */
        /*               PANAL HEXAGONAL                     */
        /* ------------------------------------------------- */

        .panal{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 900px;
            margin: auto;
        }

        .hex{
            width: 160px;
            height: 140px;
            clip-path: polygon(
                50% 0%,
                93% 25%,
                93% 75%,
                50% 100%,
                7% 75%,
                7% 25%
            );
            overflow: hidden;
            background: white;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.25);
        }

        .hex img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fila{
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .fila2{
            margin-top: 40px;
        }

    </style>
</head>
<body>

    <h1 style="text-align: center; font-size: 50px; color:#000; margin-top: 20px;">
        TRAMITES CIUDADANOS ADMINISTRATIVOS BASICOS.
    </h1>

    <!-- 🔵 FONDO DETRÁS DEL PANAL -->
    <div class="fondo-panal">

        <!-- 🌟 PANAL HEXAGONAL COMPLETO -->
        <div class="panal">

            <div class="fila fila1">
                <div class="hex"><img src="ima1.png"></div>
                <div class="hex"><img src="Imagen2.jpg"></div>
                <div class="hex"><img src="Ima3.png"></div>
            </div>

            <div class="fila fila2">
                <div class="hex"><img src="Ima4.png"></div>
                <div class="hex"><img src="ima5.png"></div>
                <div class="hex"><img src="ima6.png"></div>
                <div class="hex"><img src="ima7.png"></div>
            </div>

            <div class="fila fila3">
                <div class="hex"><img src="ima8.png"></div>
                <div class="hex"><img src="ima9.png"></div>
                <div class="hex"><img src="Ima2.png"></div>
            </div>

        </div>

    </div>

</body>
</html>
