<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trámites</title>

    <link rel="stylesheet" href="principal.css">
    <link rel="icon" href="img/unnamed-removebg-preview.png" type="png">

    <style>
        .fondo-valle{
            background-image: linear-gradient(to top, #0593bb 20%, #0e26ae 80%);
            background-size: cover;
            background-position: center;
            width: 100%;
            height: 80vh;
            background-attachment: fixed;
        }

        .contenido-fondo-valle{
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ------- ESTILO PARA LA GALERÍA -------- */
        .galeria {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .galeria_item img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform .3s;
        }

        .galeria_item img:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1 style="text-align: center; font-size: 40px; color:#0e26ae; margin-top: 20px;">
        TRÁMITES CIUDADANOS ADMINISTRATIVOS BÁSICOS
    </h1>

    <section class="gal">

            <div class="galeria_item">

                </a>
