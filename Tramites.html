<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trámites</title>
    <link rel="icon" href="img/unnamed-removebg-preview.png" type="png">

<style>
    body {
        margin: 0;
        padding: 0;
        background: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        text-align: center;
        font-size: 50px;
        color: #00eaff;
        margin-top: 40px;
        text-shadow: 0px 0px 10px #00eaff;
        font-weight: 900;
    }

    /* ----------------------------- */
    /*        CARRUSEL 3D           */
    /* ----------------------------- */

    .gallery2 {
        width: 100%;
        height: 420px;
        margin-top: 120px; /* BAJADO PARA QUE SE VEA COMPLETO */
        perspective: 2000px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .content-carrousel {
        width: 280px;
        height: 350px;
        position: relative;
        transform-style: preserve-3d;
        animation: rotate 18s infinite linear;
    }

    .content-carrousel figure {
        width: 260px;
        height: 330px;
        position: absolute;
        left: 0;
        top: 0;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .content-carrousel figure img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* --- SEPARACIÓN 3D --- */
    .content-carrousel figure:nth-child(1) { transform: rotateY(0deg) translateZ(600px); }
    .content-carrousel figure:nth-child(2) { transform: rotateY(40deg) translateZ(600px); }
    .content-carrousel figure:nth-child(3) { transform: rotateY(80deg) translateZ(600px); }
    .content-carrousel figure:nth-child(4) { transform: rotateY(120deg) translateZ(600px); }
    .content-carrousel figure:nth-child(5) { transform: rotateY(160deg) translateZ(600px); }
    .content-carrousel figure:nth-child(6) { transform: rotateY(200deg) translateZ(600px); }
    .content-carrousel figure:nth-child(7) { transform: rotateY(240deg) translateZ(600px); }
    .content-carrousel figure:nth-child(8) { transform: rotateY(280deg) translateZ(600px); }
    .content-carrousel figure:nth-child(9) { transform: rotateY(320deg) translateZ(600px); }

    @keyframes rotate {
        from { transform: rotateY(0deg); }
        to   { transform: rotateY(360deg); }
    }


    /* ----------------------------- */
    /*     GALERÍA DE IMÁGENES      */
    /* ----------------------------- */

    .galeria {
        width: 80%;
        max-width: 1200px;
        margin: 40px auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
        gap: 20px;
        padding-bottom: 80px;
    }

    .galeria_item img {
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

</style>
</head>

<body>

<h1>"ESTE DOCUMENTO ACREDITA SU IDENTIDAD"</h1>


<!-- ------------------------------ -->
<!--   CARRUSEL 3D DE DOCUMENTOS    -->
<!-- ------------------------------ -->
<div class="gallery2">
    <div class="content-carrousel">

        <!-- CAMBIA ESTAS IMÁGENES POR LAS TUYAS -->
        <figure><img src="img/acta1.png"></figure>
        <figure><img src="img/curp1.png"></figure>
        <figure><img src="img/acta2.png"></figure>
        <figure><img src="img/ine1.png"></figure>
        <figure><img src="img/curp2.png"></figure>
        <figure><img src="img/acta3.png"></figure>
        <figure><img src="img/ine2.png"></figure>
        <figure><img src="img/curp3.png"></figure>
        <figure><img src="img/ine3.png"></figure>

    </div>
</div>


<!-- ------------------------------ -->
<!--   TU GALERÍA ORIGINAL ABAJO    -->
<!-- ------------------------------ -->

<section class="gal">
    <main id="galeria" class="galeria">

        <div class="galeria_item">
            <img src="ima1.png" alt="">
        </div>

        <div class="galeria_item">
            <img src="Imagen2.jpg" alt="">
        </div>

        <div class="galeria_item">
            <img src="Ima3.png" alt="">
        </div>

        <div class="galeria_item">
            <img src="Ima4.png" alt="">
        </div>

        <div class="galeria_item">
            <img src="ima5.png" alt="">
        </div>

        <div class="galeria_item">
            <img src="ima6.png" alt="">
        </div>

        <div class="galeria_item">
            <img src="ima7.png" alt="">
        </div>

        <div class="galeria_item">
            <img src="ima8.png" alt="">
        </div>

        <div class="galeria_item">
            <img src="ima9.png" alt="">
        </div>

    </main>
</section>

</body>
</html>
